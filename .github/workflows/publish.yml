name: Publish to npm

on:
  # Trigger on GitHub Release creation
  release:
    types: [published]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest

    # Publishing uses npm trusted publishing (OIDC): GitHub mints a short-lived,
    # job-scoped credential, so there is no NPM_TOKEN to leak or expire. Requires
    # a trusted publisher configured for this package on npmjs.com, pointing at
    # this repository and this workflow file.
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: packages/cds-agents

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
        working-directory: ${{ github.workspace }}

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify npm supports trusted publishing
        run: npm --version

      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange above.
      - name: Publish to npm
        run: npm publish --access public
